version: '3.8'

services:
  openclaw-gateway:
    build: .
    volumes:
      - .:/app
    environment:
      - OPENCLAW_HOME=/app
      - OPENCLAW_LLM_PROVIDER=${OPENCLAW_LLM_PROVIDER}
      - OPENCLAW_LLM_MODEL=${OPENCLAW_LLM_MODEL}
      - OPENCLAW_LLM_API_KEY=${OPENCLAW_LLM_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OPENCLAW_MODELS_USE_SHELL_ENV=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "18789:18789"
    restart: always

# Define other specialized agent services if isolation via Docker is needed.
# For now, we'll run them within the same gateway container.
